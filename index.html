<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Receipts</title>
  <meta name="description" content="Collect receipts, let Claude pull out what matters, and split the kids' expenses between parents.">
  <meta name="theme-color" content="#0f766e">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Receipts">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <h1 data-i18n="app.title">Receipts</h1>
    <button id="settingsBtn" class="icon-btn" data-i18n-aria="settings" aria-label="Settings" title="Settings">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M19.4 13a7.5 7.5 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.6 7.6 0 0 0-1.7-1L15 3.3h-4l-.4 2.6a7.6 7.6 0 0 0-1.7 1l-2.5-1-2 3.5L6.6 11a7.5 7.5 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1a7.6 7.6 0 0 0 1.7 1l.4 2.6h4l.4-2.6a7.6 7.6 0 0 0 1.7-1l2.5 1 2-3.5zM13 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z" transform="translate(-1 0)"/></svg>
    </button>
  </header>

  <main>
    <section id="setupNotice" class="card notice" hidden>
      <strong data-i18n="setup.title"></strong>
      <p data-i18n="setup.body"></p>
      <button class="btn primary" data-open-settings data-i18n="setup.open"></button>
    </section>

    <section class="card">
      <h2 data-i18n="add.title"></h2>
      <div class="add-grid">
        <label class="btn big">
          <input id="cameraInput" type="file" accept="image/*" capture="environment" hidden>
          <span class="emoji" aria-hidden="true">📷</span> <span data-i18n="add.camera"></span>
        </label>
        <label class="btn big">
          <input id="galleryInput" type="file" accept="image/*" multiple hidden>
          <span class="emoji" aria-hidden="true">🖼️</span> <span data-i18n="add.gallery"></span>
        </label>
        <label class="btn big">
          <input id="pdfInput" type="file" accept="application/pdf,.pdf" multiple hidden>
          <span class="emoji" aria-hidden="true">📄</span> <span data-i18n="add.pdf"></span>
        </label>
        <label class="btn big">
          <input id="sheetInput" type="file" accept=".xlsx,.csv,text/csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" multiple hidden>
          <span class="emoji" aria-hidden="true">📊</span> <span data-i18n="add.sheet"></span>
        </label>
      </div>
      <div class="payer-toggle" role="group">
        <span data-i18n="payer.label"></span>
        <button type="button" data-payer="me" data-i18n="payer.me"></button>
        <button type="button" data-payer="other" data-i18n="payer.other"></button>
      </div>
      <div id="dropZone" class="drop-zone" data-i18n="add.drop"></div>
      <ul id="queue" class="queue"></ul>
      <div class="row">
        <button id="processBtn" class="btn primary" disabled data-i18n="process.idle"></button>
      </div>
    </section>

    <section class="card" id="listCard" hidden>
      <h2 data-i18n="list.title"></h2>
      <p class="hint" data-i18n="list.hint"></p>
      <p id="untagged" class="hint warn-text" hidden></p>
      <div id="receipts"></div>
    </section>

    <section class="card" id="splitCard" hidden>
      <h2 data-i18n="split.title"></h2>
      <div class="two-col">
        <label class="field"><span data-i18n="split.from"></span><input id="periodFrom" type="date"></label>
        <label class="field"><span data-i18n="split.to"></span><input id="periodTo" type="date"></label>
      </div>
      <div id="account"></div>
      <div class="row">
        <button id="exportBtn" class="btn" data-i18n="btn.export"></button>
      </div>
    </section>
  </main>

  <dialog id="settingsDialog">
    <form method="dialog" class="settings">
      <h2 data-i18n="settings"></h2>
      <label class="field">
        <span data-i18n="set.lang"></span>
        <select id="langSelect">
          <option value="auto" data-i18n="lang.auto"></option>
          <option value="en">English</option>
          <option value="fr">Français</option>
        </select>
      </label>
      <label class="field">
        <span data-i18n="set.key"></span>
        <input id="apiKey" type="password" autocomplete="off" spellcheck="false" placeholder="sk-ant-…">
      </label>
      <label class="field">
        <span data-i18n="set.model"></span>
        <select id="model">
          <option value="claude-opus-5-5" data-i18n="model.opus"></option>
          <option value="claude-sonnet-5-5" data-i18n="model.sonnet"></option>
          <option value="claude-haiku-5-5" data-i18n="model.haiku"></option>
        </select>
      </label>
      <label class="field">
        <span data-i18n="set.kids"></span>
        <textarea id="kidsContext" rows="2"></textarea>
      </label>
      <div class="two-col">
        <label class="field">
          <span data-i18n="set.share"></span>
          <input id="parentShare" type="number" min="0" max="100" step="any" inputmode="decimal" placeholder="50">
        </label>
        <label class="field">
          <span data-i18n="set.currency"></span>
          <input id="defaultCurrency" type="text" maxlength="3">
        </label>
      </div>
      <div class="row">
        <button value="save" class="btn primary" data-i18n="set.save"></button>
        <button value="cancel" class="btn ghost" formnovalidate data-i18n="set.cancel"></button>
      </div>
      <hr>
      <h3 data-i18n="backup.title"></h3>
      <p class="hint" data-i18n="backup.hint"></p>
      <div class="row wrap">
        <button type="button" id="backupBtn" class="btn" data-i18n="backup.btn"></button>
        <label class="btn">
          <input id="restoreInput" type="file" accept=".zip,application/zip" hidden>
          <span data-i18n="restore.btn"></span>
        </label>
      </div>
      <hr>
      <button type="button" id="wipeBtn" class="btn ghost danger" data-i18n="wipe.btn"></button>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script type="module" src="app.js"></script>
</body>
</html>
